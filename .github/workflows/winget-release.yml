name: WinGet Release

# Fires when a GitHub release is published (release.ps1 does that), and submits the new
# version to microsoft/winget-pkgs via komac.
#
# NOTE: `komac update` only works once SteveTheKiller.KillerShell already exists in
# winget-pkgs. The FIRST submission has to be created by hand, once:
#
#   komac new SteveTheKiller.KillerShell `
#     --version 1.0.1 `
#     --urls https://github.com/SteveTheKiller/KillerShell/releases/download/v1.0.1/KillerShell.exe `
#     --submit
#
# After that PR is merged this workflow keeps it current on its own.
# Requires a WINGET_TOKEN repo secret: a classic PAT with `public_repo` scope on a fork
# of microsoft/winget-pkgs. Same setup as KillerScan.
#
# A release-triggered run starts seconds after release.ps1 finished creating the release and
# uploading its assets, and GitHub throttles the branch push komac needs on the way out. It
# surfaces as "Ref cannot be created" or "SteveTheKiller does not have the correct permissions
# to execute CreateRef", which reads like a bad token and is not: the same secret succeeds on a
# later retry. It cost four releases across four repos before it was identified on 2026-08-26.
# The submit step now settles first and retries with backoff.
#
# workflow_dispatch is still the manual retry path: re-running this with the tag is the fix for
# anything the backoff does not outlast, and it needs no re-release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - name: Install Komac
        run: |
          # Authenticated so this does not spend the unauthenticated API allowance, which is
          # shared per runner IP and which a release-triggered run has usually already burned.
          # KillerPDF 1.7.5 failed right here on "API rate limit exceeded", before komac ran.
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "KillerShell-WinGet-Release"
          }
          $tag = (Invoke-RestMethod "https://api.github.com/repos/russellbanks/Komac/releases/latest" -Headers $headers).tag_name
          $ver = $tag.TrimStart('v')
          $url = "https://github.com/russellbanks/Komac/releases/download/$tag/komac-$ver-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\komac.exe"
          Add-Content $env:GITHUB_PATH $env:RUNNER_TEMP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh

      # komac branches from the fork's master, so a stale fork breaks the branch and the PR.
      # GitHub reports that as "does not have the correct permissions to execute CreateRef",
      # which reads like a token problem and is not. The fork was 7,877 commits behind when
      # this was tracked down on 2026-08-26, and every app shares the one fork, so all five
      # repos started failing together.
      - name: Sync the winget-pkgs fork
        run: komac sync
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh

      - name: Submit to WinGet
        run: |
          $releaseTag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { "${{ github.event.release.tag_name }}" }
          $version = $releaseTag.TrimStart('v')
          $url = "https://github.com/SteveTheKiller/KillerShell/releases/download/$releaseTag/KillerShell.exe"

          # Let the release settle before asking GitHub for a branch. See the header note.
          if ("${{ github.event_name }}" -eq "release") { Start-Sleep -Seconds 90 }

          # komac picks a fresh GUID for its branch name every run, so a retry never collides
          # with a half-finished attempt.
          $delays = @(60, 150, 300)
          for ($i = 0; $i -le $delays.Count; $i++) {
              komac update SteveTheKiller.KillerShell --version $version --urls $url --submit
              if ($LASTEXITCODE -eq 0) { exit 0 }
              if ($i -eq $delays.Count) { break }
              Write-Host "Submit failed with exit $LASTEXITCODE. Retrying in $($delays[$i])s."
              Start-Sleep -Seconds $delays[$i]
          }
          Write-Error "komac update failed after $($delays.Count + 1) attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
